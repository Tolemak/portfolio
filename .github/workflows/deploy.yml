name: Build and Deploy
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Install and Build 🔧 # This example project is built using npm and outputs the result to the 'build' folder. Replace with the commands required to build your project, or remove this step entirely if your site is pre-built.
        run: |
          yarn install --immutable --immutable-cache --check-cache
          yarn build
          touch build/.nojekyll
          cp build/404.html build/index.html

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # The folder the action should deploy.
          branch: gh-pages

      - name: Deploy to Mikrus
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (verified 2026-09-08 directly against /etc/ssh/ssh_host_ed25519_key.pub on the server).
          echo '[konrad192.mikrus.xyz]:10192 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKISUA7JlS13WF3PQaRdtugdoIwiQWt7QrMuLEJ3wQxy' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 10192 root@konrad192.mikrus.xyz "old-portfolio"
